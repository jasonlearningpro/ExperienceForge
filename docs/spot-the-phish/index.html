op","prompt":"Drag each habit to the moment it belongs to.","choices":[],"points":1,"feedbackCorrect":"Right. Pause first, check next, report last.","feedbackIncorrect":"Pause comes before you act, check comes before you trust, and report comes after you spot one.","categoryId":"practice","data":{"pairs":"Pause | Before you click, open or pay\nCheck | Before you trust a sender or a link\nReport | After you spot a phish, even if you did not fall for it"},"ext":{"experienceforge.objectives":["o_respond"]}},{"id":"q_7","kind":"slider","prompt":"A text says \"Pay $1.99 within 1 hour at hrbrvw-parcel.co/pay-now\". How many warning signs?","choices":[],"points":1,"feedbackCorrect":"Yes: the deadline, the surprise payment and the look-alike link.","feedbackIncorrect":"Count the deadline, the payment you did not expect and the look-alike link. That is three.","categoryId":"practice","data":{"min":0,"max":6,"step":1,"answer":3,"tolerance":0,"unit":"signs"},"ext":{"experienceforge.objectives":["o_pressure"]}},{"id":"q_c","kind":"single","prompt":"An email from your CEO, Dana, asks for gift cards and says not to call. Safest move?","choices":[{"id":"c_8","text":"Contact Dana using a phone number or chat you already have","correct":true,"feedback":"Yes. A different, trusted channel is the best check."},{"id":"c_9","text":"Reply to the email and ask what she needs","correct":false,"feedback":"The reply goes to the sender, who may not be Dana."},{"id":"c_a","text":"Buy one card to see whether it works","correct":false,"feedback":"You would be paying a criminal."},{"id":"c_b","text":"Forward it to a colleague and ask what they think","correct":false,"feedback":"It helps to ask, but you still have not checked with Dana."}],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Not quite.","categoryId":"practice","shuffle":true,"ext":{"experienceforge.objectives":["o_respond"]}},{"id":"q_d","kind":"picture","prompt":"Select the part of this page that shows it is a fake sign-in page.","choices":[],"points":2,"feedbackCorrect":"Right. The real domain is harborview.com. This one ends in account-verify.co.","feedbackIncorrect":"The page itself can be copied perfectly. The address is what gives it away: it does not end in harborview.com.","categoryId":"final","data":{"image":"asset_login_page","alt":"A web browser showing a sign-in page. The address bar reads https://harborview-signin.account-verify.co/login with a padlock. The page has a Harborview logo, the heading Sign in to your account, boxes for work email and password, and a Sign in button.","areas":"* The address bar | 6, 11.5, 88, 11\nThe logo | 38, 26.5, 24, 13\nThe password box | 33.5, 67, 33, 12\nThe sign-in button | 33.5, 82.5, 33, 12.5"},"ext":{"experienceforge.objectives":["o_spot"]}},{"id":"q_h","kind":"single","prompt":"The address bar shows https and a padlock. Does that prove the site is safe?","choices":[{"id":"c_e","text":"No. Criminals can get padlocks for their own sites too","correct":true,"feedback":"Right. The padlock means the connection is private, not that the site is honest."},{"id":"c_f","text":"Yes. The padlock means the site has been checked","correct":false,"feedback":"The padlock only means the connection is private."},{"id":"c_g","text":"Yes, as long as the logo looks right","correct":false,"feedback":"Logos are easy to copy."}],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Not quite.","categoryId":"final","shuffle":true,"ext":{"experienceforge.objectives":["o_spot"]}},{"id":"q_m","kind":"multiple","prompt":"Which two are warning signs of a phishing email?","choices":[{"id":"c_i","text":"A short deadline with a threat if you miss it","correct":true},{"id":"c_j","text":"A greeting that uses your full name","correct":false},{"id":"c_k","text":"A sender address that is one letter off","correct":true},{"id":"c_l","text":"A message from a colleague you were expecting","correct":false}],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Pick the two: pressure to hurry, and a look-alike address.","categoryId":"final","shuffle":true,"ext":{"experienceforge.objectives":["o_pressure"]}},{"id":"q_p","kind":"truefalse","prompt":"If a message looks like it came from your boss, you can trust it.","choices":[{"id":"c_n","text":"True","correct":false},{"id":"c_o","text":"False","correct":true}],"points":1,"feedbackCorrect":"Right. A name and a signature are easy to fake.","feedbackIncorrect":"Names and signatures are easy to fake. Check another way.","categoryId":"final","ext":{"experienceforge.objectives":["o_pressure"]}},{"id":"q_q","kind":"sequence","prompt":"You typed your password into a fake page. Put the steps in order.","choices":[],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Stop the damage first, then tell IT, then check, then stay alert.","categoryId":"final","data":{"steps":"Change your password right away\nTell IT what happened\nLook for anything odd in your accounts\nStay alert for follow-up scams"},"ext":{"experienceforge.objectives":["o_respond"]}},{"id":"q_u","kind":"single","prompt":"What is the safest way to check a message that says it is from your bank?","choices":[{"id":"c_r","text":"Call the number on the back of your card","correct":true,"feedback":"Yes. You chose where to reach them."},{"id":"c_s","text":"Call the number in the message","correct":false,"feedback":"That number may belong to the criminal."},{"id":"c_t","text":"Click the link and see where it goes","correct":false,"feedback":"Clicking is how many scams work."}],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Not quite.","categoryId":"final","shuffle":true,"ext":{"experienceforge.objectives":["o_respond"]}},{"id":"q_v","kind":"matching","prompt":"Match each word to what it means.","choices":[],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Not quite.","categoryId":"final","data":{"pairs":"Phishing | A fake email\nSmishing | A fake text message\nVishing | A fake phone call\nSpear phishing | A fake aimed at one person"},"ext":{"experienceforge.objectives":["o_pressure"]}},{"id":"q_z","kind":"single","prompt":"You get an unexpected .html attachment from \"HR\". What do you do?","choices":[{"id":"c_w","text":"Do not open it, and report it","correct":true},{"id":"c_x","text":"Open it in case it is important","correct":false},{"id":"c_y","text":"Open it, but do not enter anything","correct":false}],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"An .html attachment can be a fake page that runs on your computer. Do not open it.","categoryId":"final","shuffle":true,"ext":{"experienceforge.objectives":["o_spot"]}},{"id":"q_12","kind":"truefalse","prompt":"Reporting a phish you did not fall for helps protect your colleagues.","choices":[{"id":"c_10","text":"True","correct":true},{"id":"c_11","text":"False","correct":false}],"points":1,"feedbackCorrect":"Yes. One report lets IT warn everyone.","feedbackIncorrect":"Report it. One report lets IT warn everyone.","categoryId":"final","ext":{"experienceforge.objectives":["o_respond"]}},{"id":"q_16","kind":"single","prompt":"You think you clicked a bad link. When should you tell IT?","choices":[{"id":"c_13","text":"Right away","correct":true,"feedback":"Yes. Minutes can matter, and nobody is judging you."},{"id":"c_14","text":"At the end of the day","correct":false},{"id":"c_15","text":"Only if something strange happens","correct":false}],"points":1,"feedbackCorrect":"Correct.","feedbackIncorrect":"Not quite.","categoryId":"final","shuffle":true,"ext":{"experienceforge.objectives":["o_respond"]}}]},"quizPages":{"question":{"elements":[{"id":"qp_g1","type":"shape","shape":"ellipse","x":-170,"y":-150,"w":560,"h":560,"gradient":{"from":"rgba(45,212,191,0.45)","to":"rgba(45,212,191,0)","angle":135}},{"id":"qp_g2","type":"shape","shape":"ellipse","x":880,"y":360,"w":520,"h":520,"gradient":{"from":"rgba(255,107,129,0.40)","to":"rgba(255,107,129,0)","angle":315}},{"id":"qp_g3","type":"shape","shape": <script data-plugin="experienceforge.objectives@1.0.0">// Objectives: what a learner should be able to do, kept with the course and linked to the quiz questions that test it.
// It needs no permissions. It adds: a list of objectives (Build > Course lists), a "This question tests these objectives" field on every question,
// a Check course rule (an objective no question tests, and a quiz that asks for more from an objective than it has),
// a way for a quiz to ask a set number of questions from each objective, and a results look that charts how the learner did on each objective.
window.kfPlugins = (window.kfPlugins || []).concat([{
  manifest: { id: 'experienceforge.objectives', name: 'Objectives', version: '1.0.0', apiVersion: 1 },
  activate: function (api) {
    var LIST = 'experienceforge.objectives';
    var FIELD = 'experienceforge.objectives';
    var RULE = 'experienceforge.by-objective';

    function nameOf(row) {
      var t = typeof row.values.text === 'string' ? row.values.text.trim() : '';
      return t || 'Objective (no wording yet)';
    }
    function linked(ext) {
      var v = ext && ext[FIELD];
      return Array.isArray(v) ? v : [];
    }
    function shuffle(items, random) {
      for (var i = items.length - 1; i > 0; i--) {
        var j = Math.min(i, Math.floor(random() * (i + 1)));
        var t = items[i]; items[i] = items[j]; items[j] = t;
      }
      return items;
    }

    api.data.addList({
      id: LIST,
      label: 'Objectives',
      itemLabel: 'Objective',
      help: 'What a learner should be able to do. Link each quiz question to the objectives it tests, on the question itself.',
      maxRows: 60,
      fields: [
        { kind: 'text', key: 'text', label: 'The objective', default: '', maxLength: 200, multiline: true, help: 'Start with what the learner will do, such as "Spot a fake sender address".' },
        { kind: 'text', key: 'section', label: 'Section (optional)', default: '', maxLength: 60, help: 'The part of the course it belongs to, if you want to keep them apart.' }
      ]
    });

    api.quiz.addQuestionField({
      id: FIELD,
      label: 'This question tests these objectives',
      help: 'Tick every objective this question tests. Add objectives under Build, Course lists.',
      setting: { kind: 'multi', fromList: LIST, max: 10 }
    });

    api.quiz.addDrawRule({
      id: RULE,
      label: 'A set number from each objective',
      description: 'Takes the same number of questions from each objective in turn, so none is left out. A question that tests several counts toward the first it is chosen for.',
      settings: [
        { kind: 'number', key: 'each', label: 'Questions from each objective', default: 2, min: 1, max: 20 },
        { kind: 'boolean', key: 'fill', label: 'If an objective has too few questions, make up the number with others', default: true }
      ],
      draw: function (ctx) {
        var objectives = ctx.list(LIST);
        var each = ctx.settings.each;
        var limit = ctx.count > 0 ? ctx.count : Infinity;
        var chosen = [];
        var taken = {};
        // each objective's questions, shuffled once
        var queues = objectives.map(function (o) {
          return shuffle(ctx.pool.filter(function (q) { return linked(q.ext).indexOf(o.id) !== -1; }), ctx.random);
        });
        // round by round, so a limit smaller than every objective's share is still spread across them
        for (var round = 0; round < each && chosen.length < limit; round++) {
          for (var k = 0; k < queues.length && chosen.length < limit; k++) {
            var q = null;
            while (queues[k].length && !q) {
              var next = queues[k].shift();
              if (!taken[next.id]) q = next;
            }
            if (q) { taken[q.id] = true; chosen.push(q.id); }
          }
        }
        if (ctx.settings.fill && ctx.count > 0 && chosen.length < ctx.count) {
          var rest = shuffle(ctx.pool.filter(function (p) { return !taken[p.id]; }), ctx.random);
          for (var r = 0; r < rest.length && chosen.length < ctx.count; r++) chosen.push(rest[r].id);
        }
        return chosen;
      }
    });

    api.validation.addRule({
      id: RULE,
      label: 'Objectives are tested',
      check: function (project, ctx) {
        var found = [];
        var objectives = ctx.list(LIST);
        if (objectives.length === 0) return found;
        var counts = {};
        var anyLinked = false;
        var unlinked = 0;
        ctx.questions.forEach(function (q) {
          var ids = linked(q.ext);
          if (ids.length) anyLinked = true; else unlinked++;
          ids.forEach(function (id) { counts[id] = (counts[id] || 0) + 1; });
        });
        objectives.forEach(function (o) {
          if (!counts[o.id]) found.push({ code: RULE, severity: 'warning', message: 'The objective "' + nameOf(o) + '" is not tested by any question. Link at least one question to it, or take it out of the list.' });
        });
        if (anyLinked && unlinked > 0) {
          found.push({ code: RULE, severity: 'warning', message: unlinked + (unlinked === 1 ? ' question is' : ' questions are') + ' not linked to any objective, so they will not count in the results by objective.' });
        }
        // a quiz that takes a set number from each objective but has fewer than that for one of them
        (project.nodes || []).forEach(function (node) {
          if (node.type !== 'bankNode' || !node.data || node.data.drawRule !== RULE) return;
          var each = node.data.drawSettings && typeof node.data.drawSettings.each === 'number' ? node.data.drawSettings.each : 2;
          var cats = Array.isArray(node.data.categories) && node.data.categories.length ? node.data.categories : null;
          var pool = ctx.questions.filter(function (q) { return !cats || cats.indexOf(q.category) !== -1; });
          objectives.forEach(function (o) {
            var have = pool.filter(function (q) { return linked(q.ext).indexOf(o.id) !== -1; }).length;
            if (have < each) {
              found.push({ code: RULE, severity: 'warning', nodeId: node.id, message: 'The quiz "' + (node.data.title || node.id) + '" asks for ' + each + ' from each objective, but "' + nameOf(o) + '" has ' + have + ' question' + (have === 1 ? '' : 's') + ' in the categories it uses.' });
            }
          });
        });
        return found;
      }
    });

    api.quiz.addResultsLayout({
      id: RULE,
      label: 'Score and a chart by objective',
      render: function (ctx) {
        var doc = ctx.doc;
        var s = ctx.summary;
        var root = doc.createElement('div');
        var line = doc.createElement('p');
        line.textContent = 'You scored ' + s.percent + '%: ' + s.correct + ' of ' + s.asked + ' questions right. ' + (s.passed ? 'You passed.' : 'You did not reach the pass mark of ' + Math.round(s.passMark * 100) + '%.');
        root.appendChild(line);

        var rows = ctx.list(LIST).map(function (o) {
          var mine = ctx.answers.filter(function (a) { return linked(a.ext).indexOf(o.id) !== -1; });
          var right = mine.filter(function (a) { return a.correct; }).length;
          return { name: nameOf(o), total: mine.length, right: right, percent: mine.length ? Math.round((right / mine.length) * 100) : 0 };
        }).filter(function (r) { return r.total > 0; });
        if (rows.length === 0) return root;

        var threshold = Math.round(s.passMark * 100);
        var heading = doc.createElement('h3');
        heading.textContent = 'How you did on each objective';
        root.appendChild(heading);
        var list = doc.createElement('ul');
        list.style.cssText = 'list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px';
        rows.forEach(function (r) {
          var item = doc.createElement('li');
          var label = doc.createElement('div');
          label.textContent = r.name;
          label.style.fontWeight = '600';
          var bar = doc.createElement('progress');
          bar.max = r.total;
          bar.value = r.right;
          bar.style.cssText = 'width:100%;height:18px';
          bar.setAttribute('aria-label', r.name + ': ' + r.right + ' of ' + r.total + ' right');
          var words = doc.createElement('div');
          words.textContent = r.right + ' of ' + r.total + ' right (' + r.percent + '%)' + (r.percent < threshold ? '. Needs more practice.' : '. Solid.');
          item.appendChild(label);
          item.appendChild(bar);
          item.appendChild(words);
          list.appendChild(item);
        });
        root.appendChild(list);

        var weak = rows.filter(function (r) { return r.percent < threshold; }).sort(function (a, b) { return a.percent - b.percent; });
        var next = doc.createElement('p');
        next.textContent = weak.length
          ? 'Work on next: ' + weak.map(function (r) { return r.name; }).join('; ') + '.'
          : 'You reached the pass mark on every objective.';
        root.appendChild(next);
        return root;
      }
    });
  }
}]);
</script>
<script data-plugin="experienceforge.course-help-panel@1.0.0">// Course help panel: a Help button in the player's control bar that opens a side panel listing the keys that work and how

.kfq{position:absolute;inset:0;overflow:auto;box-sizing:border-box;padding:56px 88px 48px;display:flex;flex-direction:column;gap:22px;line-height:1.35}
.kfq *{box-sizing:border-box}
.kfq [hidden]{display:none!important}
.kfq-eyebrow{font-size:20px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:0}
.kfq-prompt{margin:0;font-weight:700;border:0;padding:0}
.kfq-hint{margin:0;font-size:20px;opacity:.75}
.kfq-instructions{margin:0;white-space:pre-wrap}
.kfq-choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.kfq-choice{display:flex;align-items:center;gap:18px;padding:16px 24px;border:3px solid var(--kfq-row-border,transparent);cursor:pointer;position:relative}
.kfq-choice input{width:26px;height:26px;flex:none;margin:0;cursor:pointer;accent-color:var(--kfq-primary)}
.kfq-choice:focus-within{outline:4px solid var(--kfq-primary);outline-offset:3px}
.kfq-choice.picked{border-color:var(--kfq-primary)}
.kfq-choice.right{border-color:#15803d}
.kfq-choice.wrong{border-color:#b91c1c}
.kfq-choice.locked{cursor:default}
.kfq-choice.locked input{cursor:default}
.kfq-mark{margin-left:auto;font-weight:700;font-size:20px;white-space:nowrap}
.kfq-note{display:block;font-size:.8em;opacity:.85;margin-top:4px}
.kfq-feedback{padding:18px 24px;border-left:8px solid var(--kfq-primary);background:var(--kfq-surface)}
.kfq-feedback.ok{border-color:#15803d}
.kfq-feedback.bad{border-color:#b91c1c}
.kfq-feedback .kfq-feedback-title{margin:0 0 4px;font-size:1.05em;font-weight:700}
.kfq-feedback p{margin:4px 0 0}
.kfq-actions{display:flex;gap:16px;margin-top:auto;padding-top:8px}
.kfq-btn{border:0;cursor:pointer;font:inherit;font-weight:600;padding:14px 38px;min-width:160px}
.kfq-btn:disabled{opacity:.45;cursor:default}
.kfq-btn:focus-visible{outline:4px solid var(--kfq-text);outline-offset:3px}
.kfq-btn.secondary{background:transparent;border:3px solid var(--kfq-primary);color:var(--kfq-text)}
.kfq-score{display:flex;align-items:baseline;gap:22px;margin:0}
.kfq-big{font-size:112px;font-weight:800;line-height:1}
.kfq-verdict{margin:0;font-weight:700}
.kfq-review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:170px;flex:1 1 170px}
.kfq-review li{padding:12px 18px;background:var(--kfq-surface);border-left:6px solid #b91c1c;font-size:.8em}
.kfq-review li.ok{border-color:#15803d}
.kfq-review b{display:block;margin-bottom:2px}
.kfq.kfq-designed{padding:0;display:block}
.kfq-designed .kfq-form,.kfq-designed .kfq-group{position:absolute;inset:0;margin:0;padding:0;border:0;min-width:0;pointer-events:none}
.kfq-designed .kfq-item{position:absolute;margin:0;pointer-events:auto}
.kfq-answer-box{padding:8px;display:flex;flex-direction:column;gap:14px}
.kfq-designed .kfq-answer-box{overflow:auto}
.kfq-designed .kfq-prompt,.kfq-designed .kfq-feedback,.kfq-designed .kfq-instructions,.kfq-designed .kfq-hint{overflow-wrap:anywhere}
.kfq-designed .kfq-btn{min-width:0;padding:0 16px}
.kfq-results-head{display:flex;flex-direction:column;gap:12px}
.kfq-designed .kfq-review{min-height:0;overflow:visible}
.kfq-designed .kfq-review-box{overflow:auto}
.kfq-scrollbox:focus-visible{outline:4px solid var(--kfq-text);outline-offset:2px}
.kfq-flow .kfq-btn{scroll-margin-bottom:calc(var(--kfp-bar-h,88px) + 16px)}
.kfq-designed .kfq-custom{overflow:auto}.kfq-designed .kfq-custom h3,.kfq-designed .kfq-custom p{margin:.35em 0}.kfq-designed .kfq-custom ul{margin:.25em 0 0} /* a plugin's results layout sits in a box of fixed height, so its spacing is kept tight to fit more before it has to scroll */
.kfq-designed .kfq-verdict,.kfq-designed .kfq-results-head{overflow-wrap:anywhere}
.kfq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kfq.kfq-flow{position:static;overflow:visible;padding:16px 16px 80px;gap:16px;min-height:100%}
.kfq-flow .kfq-form,.kfq-flow .kfq-group{display:flex;flex-direction:column;gap:16px;margin:0;padding:0;border:0;min-width:0}
.kfq-flow .kfq-answer-box{padding:4px}
.kfq-flow .kfq-form>.kfq-btn{flex:none;width:100%}
.kfq-flow .kfq-eyebrow{font-size:14px}
.kfq-flow .kfq-hint{font-size:16px}
.kfq-flow .kfq-choice{padding:14px 16px;gap:12px;flex-wrap:wrap}
.kfq-flow .kfq-mark{margin-left:0;white-space:normal}
.kfq-flow .kfq-feedback{padding:14px 16px}
.kfq-flow .kfq-actions{flex-wrap:wrap;margin-top:8px}
.kfq-flow .kfq-btn{min-width:0;flex:1 1 140px;padding:12px 20px}
.kfq-flow .kfq-score{flex-wrap:wrap;gap:8px 16px}
.kfq-flow .kfq-big{font-size:clamp(48px,18vw,88px)}
.kfq-flow .kfq-review{min-height:0;flex:none;overflow:visible}
.kfq-flow .kfq-prompt,.kfq-flow .kfq-verdict,.kfq-flow .kfq-choice{overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.kfq-btn,.kfq-choice{transition:background .15s ease,border-color .15s ease}}
